# ==========================================================
# Nagar Drishti — Render Infrastructure as Code Blueprint
# https://render.com/docs/blueprint-spec
# ==========================================================

services:
  # 1. Backend REST API
  - type: web
    name: nagar-drishti-backend
    runtime: node
    plan: free
    region: singapore # Close to India (Delhi-NCR)
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: '*'
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: N8N_WEBHOOK_BASE_URL
        sync: false
      - key: N8N_WEBHOOK_SECRET
        generateValue: true
      - key: UPLOAD_MAX_SIZE_MB
        value: 10
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: escalations@nagardrishti.gov.in
      - key: HIGHER_AUTHORITY_EMAIL
        value: admin@nagardrishti.gov.in

  # 2. Frontend Web Application (Static Site)
  - type: web
    name: nagar-drishti-frontend
    runtime: static
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: ./
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
